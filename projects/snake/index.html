<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>스네이크 게임</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="container">
    <h1>🐍 스네이크 게임</h1>

    <div class="scoreboard">
      <div>점수: <span id="score">0</span></div>
      <div>레벨: <span id="level">1</span></div>
      <div>최고 점수: <span id="high-score">0</span></div>
    </div>

    <div class="controls">
      <label>
        난이도
        <select id="difficulty">
          <option value="200">쉬움</option>
          <option value="150" selected>보통</option>
          <option value="100">어려움</option>
          <option value="50">매우 어려움</option>
        </select>
      </label>
      <button id="pause-btn" class="small" disabled>일시정지</button>
    </div>

    <div class="board">
      <canvas id="game" width="400" height="400"></canvas>

      <div id="start-screen" class="overlay">
        <p>방향키로 뱀을 조종하세요</p>
        <button id="start-btn">게임 시작</button>
      </div>

      <div id="pause-screen" class="overlay hidden">
        <h2 class="paused">일시정지</h2>
      </div>

      <div id="gameover-screen" class="overlay hidden">
        <h2>게임 오버</h2>
        <p>점수: <span id="final-score">0</span> · 레벨: <span id="final-level">1</span></p>
        <button id="restart-btn">다시 시작</button>
      </div>
    </div>
  </main>

  <script src="main.js"></script>
</body>
</html>
